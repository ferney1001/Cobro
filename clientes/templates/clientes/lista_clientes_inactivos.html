{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes inactivos - Cobro</title>

    <link
        rel="stylesheet"
        href="{% static 'clientes/css/clientes.css' %}"
    >
</head>

<body>

    <div class="contenedor">

        <a
            href="{% url 'lista_clientes' %}"
            class="boton-volver"
        >
            ← Volver a clientes
        </a>

        <div class="encabezado">

            <h1>
                Clientes inactivos
            </h1>

        </div>

        {% for cliente in clientes %}

            <div class="cliente">

                <h2>
                    {{ cliente.nombre }}
                    {{ cliente.apellido }}
                </h2>

                <p>
                    📱 {{ cliente.telefono }}
                </p>

                <div class="acciones">

                    <form
                        method="post"
                        action="{% url 'reactivar_cliente' cliente.id %}"
                    >
                        {% csrf_token %}

                        <button
                            type="submit"
                            class="boton-editar"
                        >
                            Reactivar
                        </button>

                    </form>

                </div>
            </div>

        {% empty %}

            <div class="sin-clientes">

                <p>
                    No hay clientes inactivos.
                </p>

            </div>

        {% endfor %}

    </div>

</body>

</html>
